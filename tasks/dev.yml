# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Dev/lint/run tasks — invoked as `task dev:<name>`. See docs/adr/0020-task-automation-modular-taskfiles.md
version: '3'

tasks:
  setup:
    desc: Create a virtualenv and install dependencies
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install -U pip
      # --extra-index-url pulls the CPU-only torch build on Linux (sentence-transformers'
      # dependency) instead of PyPI's default CUDA-bundled wheel -- see Dockerfile for the
      # full rationale. Harmless no-op on macOS, which only ever has a CPU/Metal wheel anyway.
      - .venv/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt -r requirements-dev.txt

  lint:
    desc: Run static analysis (ruff) and type checking (mypy)
    cmds:
      - .venv/bin/ruff check app tests
      - .venv/bin/mypy app

  format:
    desc: Auto-format the codebase with ruff
    cmds:
      - .venv/bin/ruff format app tests

  api:
    desc: Run the FastAPI app locally with autoreload
    cmds:
      - .venv/bin/uvicorn app.api.main:app --reload --port 8000
