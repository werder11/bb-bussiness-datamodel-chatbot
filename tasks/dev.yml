# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Dev/lint/run tasks — invoked as `task dev:<name>`. See docs/adr/0020-task-automation-modular-taskfiles.md
version: '3'

tasks:
  setup:
    desc: Create a virtualenv and install dependencies (uv)
    cmds:
      # Reads pyproject.toml + uv.lock; creates/updates .venv in place, so
      # every `.venv/bin/*` invocation elsewhere in this Taskfile keeps
      # working unchanged. The CPU-only-torch-on-Linux behavior a plain pip
      # install needed an `--extra-index-url` flag for now lives in
      # pyproject.toml's [tool.uv.sources]/[[tool.uv.index]] instead — see
      # docs/adr/0031-migrate-to-uv.md.
      - uv sync

  lint:
    desc: Run static analysis (ruff) and type checking (mypy)
    cmds:
      - .venv/bin/ruff check app tests
      - .venv/bin/mypy app

  format:
    desc: Auto-format the codebase with ruff
    cmds:
      - .venv/bin/ruff format app tests

  api:
    desc: Run the FastAPI app locally with autoreload
    cmds:
      - .venv/bin/uvicorn app.api.main:app --reload --port 8000
